global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - my-work-alerts.yml

scrape_configs:
  # Metrics emitted via OpenTelemetry and exposed by the collector.
  - job_name: my-work-otel
    static_configs:
      - targets: ['otel-collector:8889']

  # Synthetic probe: runs every 60 seconds through Blackbox Exporter.
  - job_name: my-work-synthetic
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [my_work_query]
    static_configs:
      - targets:
          - https://my-work.example.com/api/my-work/query
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
